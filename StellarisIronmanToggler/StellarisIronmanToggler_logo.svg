<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg5"
   sodipodi:docname="StellarisIronmanToggler.svg"
   inkscape:export-filename="StellarisIronmanToggler.png"
   inkscape:export-xdpi="48"
   inkscape:export-ydpi="48"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview5"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.0375"
     inkscape:cx="200"
     inkscape:cy="200"
     inkscape:current-layer="svg5" />
  <!-- Background Shield -->
  <rect
     width="400"
     height="400"
     rx="80"
     fill="#0B1D26"
     id="rect1" />
  <!-- Stellar Glow (Nebula effect) -->
  <defs
     id="defs2">
    <radialGradient
       id="glow"
       cx="50%"
       cy="50%"
       r="50%">
      <stop
         offset="0%"
         style="stop-color:#00D2FF;stop-opacity:0.4"
         id="stop1" />
      <stop
         offset="100%"
         style="stop-color:#0B1D26;stop-opacity:0"
         id="stop2" />
    </radialGradient>
  </defs>
  <circle
     cx="200"
     cy="200"
     r="150"
     fill="url(#glow)"
     id="circle2" />
  <!-- Main Save Icon (Floppy Disk Shape) -->
  <path
     d="M120 100H250L300 150V300H120V100Z"
     fill="none"
     stroke="#00D2FF"
     stroke-width="12"
     stroke-linejoin="round"
     id="path2" />
  <rect
     x="150"
     y="100"
     width="80"
     height="60"
     fill="none"
     stroke="#00D2FF"
     stroke-width="8"
     id="rect2" />
  <rect
     x="150"
     y="210"
     width="100"
     height="90"
     fill="none"
     stroke="#00D2FF"
     stroke-width="8"
     id="rect3" />
  <!-- Speed Lines (Streaming Effect) -->
  <line
     x1="60"
     y1="180"
     x2="160"
     y2="180"
     stroke="#FFFFFF"
     stroke-width="10"
     stroke-linecap="round"
     opacity="0.8"
     id="line3">
    <animate
       attributeName="x1"
       values="60;20;60"
       dur="2s"
       repeatCount="indefinite" />
  </line>
  <line
     x1="40"
     y1="220"
     x2="180"
     y2="220"
     stroke="#FFFFFF"
     stroke-width="10"
     stroke-linecap="round"
     opacity="0.5"
     id="line4">
    <animate
       attributeName="x1"
       values="40;0;40"
       dur="1.5s"
       repeatCount="indefinite" />
  </line>
  <line
     x1="70"
     y1="260"
     x2="140"
     y2="260"
     stroke="#FFFFFF"
     stroke-width="10"
     stroke-linecap="round"
     opacity="0.3"
     id="line5">
    <animate
       attributeName="x1"
       values="70;40;70"
       dur="2.5s"
       repeatCount="indefinite" />
  </line>
  <!-- Toggle Indicator (Binary 1/0) -->
  <circle
     cx="320"
     cy="120"
     r="30"
     fill="#00D2FF"
     id="circle5" />
  <path
     d="M310 120L330 120M320 110L320 130"
     stroke="#0B1D26"
     stroke-width="6"
     stroke-linecap="round"
     id="path5" />
</svg>
